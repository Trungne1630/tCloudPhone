<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Đăng nhập — tCloudPhone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>☁</text></svg>">
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel-2:#18202b;
    --border:#232d3a; --text:#e6edf3; --muted:#8b98a9;
    --accent:#4f8cff; --ok:#22c55e; --danger:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 0%,#16233a 0%,#0b0f14 60%);
    color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .auth-card{
    width:420px;max-width:100%;background:var(--panel);
    border:1px solid var(--border);border-radius:18px;
    padding:32px 28px;box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;justify-content:center;margin-bottom:8px}
  .logo .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#4f8cff,#22c55e);display:flex;align-items:center;justify-content:center;font-size:16px}
  .logo span{color:var(--accent)}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
  .tabs{display:flex;background:var(--panel-2);border-radius:10px;padding:4px;margin-bottom:22px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);transition:.15s;user-select:none}
  .tab.active{background:var(--accent);color:#fff;font-weight:600}
  form{display:none;flex-direction:column;gap:14px}
  form.active{display:flex}
  label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
  .field{position:relative}
  .field input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;color:var(--text);
    outline:none;font-size:14px;transition:.15s;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .field input.error{border-color:var(--danger)}
  .toggle-pass{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    cursor:pointer;color:var(--muted);font-size:16px;user-select:none;
  }
  .btn{
    padding:12px;border-radius:10px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);cursor:pointer;
    font-size:14px;transition:.15s;font-weight:600;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#3b7bf0}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.error{background:#3b1a1a;color:#ff8a8a;border:1px solid #5a2a2a}
  .msg.ok{background:#0f2a1a;color:#7ee7a1;border:1px solid #1a4a2a}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
  .hint code{background:#060a0f;padding:2px 6px;border-radius:4px;color:#8ef0a8}
</style>
</head>
<body>

<div class="auth-card">
  <div class="logo"><div class="dot">☁</div>t<span>Cloud</span>Phone</div>
  <div class="subtitle">Điều khiển Cloud Phone mọi lúc, mọi nơi</div>

  <div class="tabs">
    <div class="tab active" data-tab="login" onclick="switchTab('login')">Đăng nhập</div>
    <div class="tab" data-tab="register" onclick="switchTab('register')">Đăng ký</div>
  </div>

  <div class="msg" id="msg"></div>

  <!-- LOGIN -->
  <form id="loginForm" class="active" onsubmit="doLogin(event)">
    <div>
      <label>Email</label>
      <div class="field"><input id="liEmail" type="email" placeholder="you@example.com" autocomplete="email" required /></div>
    </div>
    <div>
      <label>Mật khẩu</label>
      <div class="field">
        <input id="liPass" type="password" placeholder="••••••••" autocomplete="current-password" required />
        <span class="toggle-pass" onclick="togglePass('liPass', this)">👁</span>
      </div>
    </div>
    <button type="submit" class="btn primary" id="liBtn">Đăng nhập</button>
    <div class="hint">Chưa có tài khoản? Nhấn tab <b>Đăng ký</b> ở trên.</div>
  </form>

  <!-- REGISTER -->
  <form id="registerForm" onsubmit="doRegister(event)">
    <div>
      <label>Họ tên</label>
      <div class="field"><input id="rgName" placeholder="Nguyễn Văn A" required /></div>
    </div>
    <div>
      <label>Email</label>
      <div class="field"><input id="rgEmail" type="email" placeholder="you@example.com" autocomplete="email" required /></div>
    </div>
    <div>
      <label>Mật khẩu (≥ 6 ký tự)</label>
      <div class="field">
        <input id="rgPass" type="password" placeholder="••••••••" minlength="6" autocomplete="new-password" required />
        <span class="toggle-pass" onclick="togglePass('rgPass', this)">👁</span>
      </div>
    </div>
    <div>
      <label>Nhập lại mật khẩu</label>
      <div class="field"><input id="rgPass2" type="password" placeholder="••••••••" minlength="6" autocomplete="new-password" required /></div>
    </div>
    <button type="submit" class="btn primary" id="rgBtn">Tạo tài khoản</button>
    <div class="hint">
      Bằng việc đăng ký, bạn đồng ý với điều khoản sử dụng.<br/>
      Dữ liệu lưu tại <code>localStorage</code> của trình duyệt.
    </div>
  </form>
</div>

<script>
/* =========================================================
   HELPERS
========================================================= */
const USERS_KEY = 'tcloudphone_users';
const SESSION_KEY = 'tcloudphone_session';

function getUsers(){ try{ return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }catch{ return {}; } }
function saveUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }

function showMsg(text, type='error'){
  const m = document.getElementById('msg');
  m.className = 'msg show ' + type;
  m.textContent = text;
  if(type === 'ok') setTimeout(() => m.classList.remove('show'), 3000);
}

function togglePass(id, el){
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  el.textContent = inp.type === 'password' ? '👁' : '🙈';
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('loginForm').classList.toggle('active', tab === 'login');
  document.getElementById('registerForm').classList.toggle('active', tab === 'register');
  document.getElementById('msg').classList.remove('show');
}

/* =========================================================
   CRYPTO — PBKDF2 hash (không lưu plaintext)
========================================================= */
async function hashPassword(password, saltHex){
  const enc = new TextEncoder();
  const salt = saltHex ? hexToBytes(saltHex) : crypto.getRandomValues(new Uint8Array(16));
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt, iterations: 120000, hash: 'SHA-256' },
    keyMaterial, 256
  );
  return {
    hash: bytesToHex(new Uint8Array(bits)),
    salt: bytesToHex(salt),
  };
}
function bytesToHex(b){ return [...b].map(x => x.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(h){
  const arr = new Uint8Array(h.length / 2);
  for(let i=0;i<arr.length;i++) arr[i] = parseInt(h.substr(i*2,2),16);
  return arr;
}

/* =========================================================
   AUTH FLOW
========================================================= */
async function doRegister(e){
  e.preventDefault();
  const btn = document.getElementById('rgBtn');
  btn.disabled = true; btn.textContent = 'Đang tạo...';
  try{
    const name = document.getElementById('rgName').value.trim();
    const email = document.getElementById('rgEmail').value.trim().toLowerCase();
    const pass = document.getElementById('rgPass').value;
    const pass2 = document.getElementById('rgPass2').value;

    if(!name) return showMsg('Vui lòng nhập họ tên');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return showMsg('Email không hợp lệ');
    if(pass.length < 6) return showMsg('Mật khẩu phải ≥ 6 ký tự');
    if(pass !== pass2) return showMsg('Mật khẩu nhập lại không khớp');

    const users = getUsers();
    if(users[email]) return showMsg('Email này đã được đăng ký');

    const { hash, salt } = await hashPassword(pass);
    users[email] = { name, email, hash, salt, createdAt: Date.now() };
    saveUsers(users);

    showMsg('✅ Đăng ký thành công! Đang đăng nhập...', 'ok');
    localStorage.setItem(SESSION_KEY, JSON.stringify({ email, name, at: Date.now() }));
    setTimeout(() => location.href = 'index.html', 800);
  } catch(err){
    showMsg('Lỗi: ' + err.message);
  } finally{
    btn.disabled = false; btn.textContent = 'Tạo tài khoản';
  }
}

async function doLogin(e){
  e.preventDefault();
  const btn = document.getElementById('liBtn');
  btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
  try{
    const email = document.getElementById('liEmail').value.trim().toLowerCase();
    const pass = document.getElementById('liPass').value;

    const users = getUsers();
    const user = users[email];
    if(!user) return showMsg('Email hoặc mật khẩu không đúng');

    const { hash } = await hashPassword(pass, user.salt);
    if(hash !== user.hash) return showMsg('Email hoặc mật khẩu không đúng');

    localStorage.setItem(SESSION_KEY, JSON.stringify({ email: user.email, name: user.name, at: Date.now() }));
    showMsg('✅ Đăng nhập thành công!', 'ok');
    setTimeout(() => location.href = 'index.html', 500);
  } catch(err){
    showMsg('Lỗi: ' + err.message);
  } finally{
    btn.disabled = false; btn.textContent = 'Đăng nhập';
  }
}

/* =========================================================
   AUTO-REDIRECT nếu đã đăng nhập
========================================================= */
(function(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    if(s && s.email) location.href = 'index.html';
  }catch{}
})();
</script>
</body>
</html>
